<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oráculo</title>

  <!--
    O ícone da aba, FORA do bloco do mapa de importação logo abaixo: qualquer
    mudança dentro dele troca o hash da CSP e a aplicação para de carregar.

    Três arquivos porque são três clientes. O `.ico` vem primeiro e responde ao
    pedido que o navegador faz sozinho por `/favicon.ico` — sem ele, o pedido
    cai no fallback de página única e recebe o index.html inteiro. O SVG serve
    todo tamanho a quem o entende, e o do iOS o sistema busca por conta dele.

    O ícone tem fundo próprio e não segue o tema do Oráculo: ele vive na barra
    de abas, que é do navegador. A cor está GRAVADA nos arquivos (o violeta da
    marca no tema claro, com o símbolo branco) — se a marca mudar, os três se
    refazem a partir do `favicon.svg` e do `assets/brand/apple-touch-icon.svg`.
  -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!--
    O mapa de importação é o único script inline da página, e não carrega
    comportamento: ele só ensina ao navegador que "@/" é a raiz de src/.

    É o que o PADROES-ENGENHARIA.md §2.7 prescreve para projeto sem build, e
    o que permite escrever `@/shared/api/client.js` em vez de `../../../`.
    Caminho relativo esconde violação de camada; com prefixo absoluto, a
    fronteira fica visível na própria linha do import — que é justamente o
    que o bin/check-boundaries.php lê.

    Precisa ser inline: mapa de importação externo não é suportado pelos
    navegadores. Ele entra na Content-Security-Policy por hash (F-051).
  -->
  <script type="importmap">
    {
      "imports": {
        "@/": "/src/"
      }
    }
  </script>

  <!--
    A ordem é a do cascata e não é arbitrária: os tokens precisam existir
    antes de qualquer regra que os consuma, e os utilitários vêm por último
    para vencerem o padrão de elemento sem precisar de !important.

    Nenhuma fonte remota e nenhum CSS de CDN (RNF-01).
  -->
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/utilities.css">
  <link rel="stylesheet" href="/src/styles/components.css">
</head>
<body>
  <noscript>O Oráculo precisa de JavaScript habilitado.</noscript>

  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
