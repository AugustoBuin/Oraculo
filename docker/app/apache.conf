# O frontend é servido da raiz e a API vive em /api, na MESMA origem.
# É isso que elimina CORS, preflight e SameSite=None (docs/decisions/ADR-003).
#
# Nada fora de frontend/public e do front controller do backend é alcançável
# pela web: src/, migrations/, storage/ e .env não têm caminho servido.

# Sem isto o Apache avisa a cada boot que não conseguiu determinar o nome do
# servidor e usa o IP do contêiner. É só ruído, mas ruído no log de boot
# treina quem opera a ignorar o log.
ServerName localhost

# --- Content-Security-Policy do documento --------------------------------
#
# A CSP da API mora no PHP (Infra/Http/Middleware/SecurityHeaders.php) e
# continua lá: cada camada declara a sua. Esta aqui é a do DOCUMENTO — a
# única que o navegador consulta na hora de decidir qual script executar.
#
# Sem 'unsafe-inline' e sem 'unsafe-eval' (RNF-08). Com eles, script injetado
# executa igual e a política vira decoração.
#
# A parte comum, que não depende de qual página é servida:
#
# - `img-src` aceita https externo porque carta pode ter imagem informada por
#   URL (RF-31), e `blob:` porque a pré-visualização do upload mostra o
#   arquivo escolhido antes de enviá-lo (`URL.createObjectURL`). Não aceita
#   `data:`: `isSafeUrl` já recusa esse esquema na borda, e deixá-lo aberto
#   reabriria por baixo o que a borda fecha.
# - `style-src 'self'` sem hash nenhum: não existe `<style>` nem atributo
#   `style` na aplicação. O que existe é `element.style.setProperty` no
#   modal, e CSSOM não passa pela CSP.
# - `frame-ancestors 'none'` fecha o clickjacking na fonte; o
#   `X-Frame-Options` abaixo é a mesma regra para quem ainda não lê a CSP.
Define CSP_COMUM "img-src 'self' https: blob:; style-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"

# O hash é do mapa de importação de `frontend/public/index.html`, o único
# script inline da aplicação (mapa de importação externo não é suportado por
# navegador nenhum). Hash e não nonce: sem processo de build não há de onde
# sair um valor novo por requisição, e nonce fixo é pior que hash.
#
# ATENÇÃO: mexeu no bloco `<script type="importmap">` daquele arquivo — nem
# que seja um espaço — o hash muda e a aplicação para de carregar. O valor
# novo sai do próprio console do navegador, na mensagem do bloqueio.
Define CSP_APP "default-src 'self'; script-src 'self' 'sha256-uBe61TLOgUZyopiIimcIToVknvqJ+W5vLpBrThdXkaA='; ${CSP_COMUM}"

# A página de testes tem o mapa de importação dela, com o `~/` da
# infraestrutura de teste — outro conteúdo, outro hash. Fica numa política à
# parte de propósito: o que é da página de testes não entra na política da
# aplicação entregue.
Define CSP_TESTES "default-src 'self'; script-src 'self' 'sha256-1ZXl6zUZKdHuAFAQSI6ao8S/QDCbF4P46LbHBo8Fg/k='; ${CSP_COMUM}"

<VirtualHost *:80>
    DocumentRoot /var/www/frontend/public

    # Toda a API passa pelo front controller. AcceptPathInfo entrega o restante
    # do caminho em PATH_INFO, que é o que o roteador consome.
    AcceptPathInfo On
    Alias /api /var/www/backend/public/index.php

    <Directory /var/www/backend/public>
        Require all granted
        AllowOverride None
        Options -Indexes
    </Directory>

    # O código do frontend mora em frontend/src, fora do DocumentRoot, e é
    # servido por este Alias. Em front-end todo o código é público por
    # natureza — qualquer pessoa lê o fonte, altera valores em memória e refaz
    # as requisições à mão (PADROES-ENGENHARIA.md §8). O que precisa ficar
    # inalcançável é backend/src, .env, migrations e storage, e nenhum deles
    # ganha caminho servido aqui.
    #
    # A alternativa seria mover o código para dentro de public/, mas o
    # verificador de fronteiras (bin/check-boundaries.php) e as regras de
    # LayerBoundary já apontam para frontend/src. Mudar o layout para agradar
    # o servidor web custaria uma alteração em código de backend já auditado.
    Alias /src /var/www/frontend/src

    <Directory /var/www/frontend/src>
        Require all granted
        AllowOverride None
        Options -Indexes

        # Sem isto o Apache manda ETag e Last-Modified mas nenhum
        # Cache-Control, e o navegador aplica cache HEURÍSTICO: ele decide
        # sozinho por quanto tempo o arquivo serve. O resultado é editar um
        # módulo, recarregar, e ver o código antigo rodando — sem erro nenhum
        # para indicar o que houve.
        #
        # `no-cache` não desliga o cache: obriga a revalidar. A resposta
        # continua sendo 304 quando nada mudou, então o custo é um par de
        # cabeçalhos, e nunca se serve JavaScript vencido.
        Header set Cache-Control "no-cache"
    </Directory>

    # A página de testes (F-004). Importa os módulos REAIS de /src, e por isso
    # precisa ser servida da mesma origem que eles. Não expõe nada além do que
    # /src já expõe: o que ela acrescenta é o runner e as suítes.
    Alias /tests /var/www/frontend/tests

    <Directory /var/www/frontend/tests>
        Require all granted
        AllowOverride None
        Options -Indexes

        DirectoryIndex index.html

        # Mesmo motivo de /src: uma suíte servida do cache faz um teste novo
        # simplesmente não aparecer no placar, o que é pior do que falhar.
        Header set Cache-Control "no-cache"

        # A página de testes roda sob CSP igual à da aplicação — se ela
        # precisasse de uma folga que a aplicação não tem, a suíte estaria
        # exercitando um ambiente que não existe.
        Header always set Content-Security-Policy "${CSP_TESTES}"
    </Directory>

    <Directory /var/www/frontend/public>
        Require all granted
        AllowOverride None
        Options -Indexes +FollowSymLinks

        # `always`, e não a tabela onsuccess: sem isso a resposta de erro do
        # próprio Apache — um 404 servido antes do fallback, por exemplo —
        # sairia sem política nenhuma.
        Header always set Content-Security-Policy "${CSP_APP}"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "same-origin"

        # Fallback de aplicação de página única: o que não for arquivo nem
        # diretório existente volta para o index.html.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Logs vão para a saída do contêiner; o Docker coleta.
    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
