# O frontend é servido da raiz e a API vive em /api, na MESMA origem.
# É isso que elimina CORS, preflight e SameSite=None (docs/decisions/ADR-003).
#
# Nada fora de frontend/public e do front controller do backend é alcançável
# pela web: src/, migrations/, storage/ e .env não têm caminho servido.

# Sem isto o Apache avisa a cada boot que não conseguiu determinar o nome do
# servidor e usa o IP do contêiner. É só ruído, mas ruído no log de boot
# treina quem opera a ignorar o log.
ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/frontend/public

    # Toda a API passa pelo front controller. AcceptPathInfo entrega o restante
    # do caminho em PATH_INFO, que é o que o roteador consome.
    AcceptPathInfo On
    Alias /api /var/www/backend/public/index.php

    <Directory /var/www/backend/public>
        Require all granted
        AllowOverride None
        Options -Indexes
    </Directory>

    # O código do frontend mora em frontend/src, fora do DocumentRoot, e é
    # servido por este Alias. Em front-end todo o código é público por
    # natureza — qualquer pessoa lê o fonte, altera valores em memória e refaz
    # as requisições à mão (PADROES-ENGENHARIA.md §8). O que precisa ficar
    # inalcançável é backend/src, .env, migrations e storage, e nenhum deles
    # ganha caminho servido aqui.
    #
    # A alternativa seria mover o código para dentro de public/, mas o
    # verificador de fronteiras (bin/check-boundaries.php) e as regras de
    # LayerBoundary já apontam para frontend/src. Mudar o layout para agradar
    # o servidor web custaria uma alteração em código de backend já auditado.
    Alias /src /var/www/frontend/src

    <Directory /var/www/frontend/src>
        Require all granted
        AllowOverride None
        Options -Indexes
    </Directory>

    # A página de testes (F-004). Importa os módulos REAIS de /src, e por isso
    # precisa ser servida da mesma origem que eles. Não expõe nada além do que
    # /src já expõe: o que ela acrescenta é o runner e as suítes.
    Alias /tests /var/www/frontend/tests

    <Directory /var/www/frontend/tests>
        Require all granted
        AllowOverride None
        Options -Indexes

        DirectoryIndex index.html
    </Directory>

    <Directory /var/www/frontend/public>
        Require all granted
        AllowOverride None
        Options -Indexes +FollowSymLinks

        # Fallback de aplicação de página única: o que não for arquivo nem
        # diretório existente volta para o index.html.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Logs vão para a saída do contêiner; o Docker coleta.
    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
