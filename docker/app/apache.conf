# O frontend é servido da raiz e a API vive em /api, na MESMA origem.
# É isso que elimina CORS, preflight e SameSite=None (docs/decisions/ADR-003).
#
# Nada fora de frontend/public e do front controller do backend é alcançável
# pela web: src/, migrations/, storage/ e .env não têm caminho servido.

# Sem isto o Apache avisa a cada boot que não conseguiu determinar o nome do
# servidor e usa o IP do contêiner. É só ruído, mas ruído no log de boot
# treina quem opera a ignorar o log.
ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/frontend/public

    # Toda a API passa pelo front controller. AcceptPathInfo entrega o restante
    # do caminho em PATH_INFO, que é o que o roteador consome.
    AcceptPathInfo On
    Alias /api /var/www/backend/public/index.php

    <Directory /var/www/backend/public>
        Require all granted
        AllowOverride None
        Options -Indexes
    </Directory>

    <Directory /var/www/frontend/public>
        Require all granted
        AllowOverride None
        Options -Indexes +FollowSymLinks

        # Fallback de aplicação de página única: o que não for arquivo nem
        # diretório existente volta para o index.html.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Logs vão para a saída do contêiner; o Docker coleta.
    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
