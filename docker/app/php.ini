; Erro renderizado na resposta entrega caminho absoluto, versão do PHP e às
; vezes o conteúdo da query. Fica desligado; o texto real vai só para o log.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = /dev/stderr

; Não anunciar a versão do PHP no cabeçalho da resposta.
expose_php = Off

; Sessão: id só por cookie, id inválido nunca é aceito, e o cookie é inacessível
; ao JavaScript. O atributo Secure é definido em runtime conforme o ambiente,
; porque em http local um cookie Secure simplesmente não é gravado.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid    = 0
session.cookie_httponly  = 1
session.cookie_samesite  = Lax

; Teto do servidor para upload. O limite de aplicação vem de UPLOAD_MAX_BYTES e
; é verificado antes de gravar; estes valores são a rede de proteção do PHP.
upload_max_filesize = 4M
post_max_size       = 6M
memory_limit        = 128M

date.timezone = America/Sao_Paulo
